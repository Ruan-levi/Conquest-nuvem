name: CONQUEST - Entregavel 5 AWS
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-aws:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar servico REST e banco SQLite na AWS
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 25 http://3.149.254.9/api/health | grep '"service":"Conquest"'
      - name: Verificar portal publico 3D
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 25 http://3.149.254.9/ | grep -q 'CONQUEST'
      - name: Verificar ranking sem login
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 25 http://3.149.254.9/api/ranking | grep -q '^\['
      - name: Verificar protecao de acesso
        run: |
          set -eu
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 25 http://3.149.254.9/api/me)" = '401'
