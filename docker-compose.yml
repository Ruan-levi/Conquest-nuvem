# Stack para Portainer na VPS OCI.
# Porta do jogo somente local no host; configure proxy HTTPS no Ubuntu.
services:
  conquest:
    image: ghcr.io/ruan-levi/conquest-nuvem:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
